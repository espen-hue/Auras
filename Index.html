<script>
  function copy(el, text) {
    navigator.clipboard.writeText(text);
    const original = el.innerText;
    el.innerText = "Copied!";
    el.classList.add("copied");

    setTimeout(() => {
      el.innerText = original;
      el.classList.remove("copied");
    }, 1200);
  }
</script>
